services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    command: serve
    volumes:
      - ./data:/var/cache/ntfy
      - ./server.yml:/etc/ntfy/server.yml:ro
    networks:
      - frontend

networks:
  frontend:
    name: docker_proxy_network
    external: true
