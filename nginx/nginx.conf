worker_processes auto;

events {
  worker_connections 1024;
}

stream {
  server {
    listen 34197 udp reuseport;
    proxy_pass factorio-server:34197;
  }
}

http {
  client_max_body_size 10M;
  proxy_headers_hash_max_size 1024;
  proxy_headers_hash_bucket_size 128;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;

  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_name www.dogdaysadventure.xyz dogdaysadventure.xyz;
    server_tokens off;

    #location /.well-known/acme-challenge/ {
    #  root /var/www/certbot;
    #}

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 default_server ssl;
    listen [::]:443 ssl;
    server_name localhost;
    server_name dogdaysadventure.xyz;

    #ssl_certificate /etc/letsencrypt/live/dogdaysadventure.xyz/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/dogdaysadventure.xyz/privkey.pem;
    #ssl_dhparam /etc/letsencrpyt/ssl-dhparams.pem;
    #include /etc/letsencrpyt/options-ssl-nginx.conf;
    #ssl_certificate /etc/nginx/certs/fullchain.pem;
    #ssl_certificate_key /etc/nginx/certs/private.key;


    ssl_certificate /etc/nginx/certs/domain.cert.pem;
    ssl_certificate_key /etc/nginx/certs/private.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    #location /.well-known/acme-challenge/ {
    #  root /var/www/certbot;
    #}
    location / {
      proxy_pass http://activepetz:80/;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pdf.dogdaysadventure.xyz;

    location / {
      proxy_pass http://pdf_tool:8080;
      proxy_http_version 1.1;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tools.dogdaysadventure.xyz;

    location / {
      proxy_pass http://it-tools:80/;
      proxy_http_version 1.1;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docs.dogdaysadventure.xyz;

    location / {
      proxy_pass http://paperless:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_redirect off;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
  }

  #server {
  #    listen 443 ssl;
  #    listen [::]:443 ssl;
  #    server_name finance.dogdaysadventure.xyz;

  #    location / {
  #        proxy_pass http://maybe-finance-webapp:3000/;
  #        proxy_http_version 1.1;
  #        proxy_set_header Host $http_host;
  #        proxy_set_header X-Real-IP $remote_addr;
  #        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #        proxy_set_header X-Forwarded-Proto $scheme;
  #    }
  #}

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name actual-budget.dogdaysadventure.xyz;

    location / {
      proxy_pass http://actual-server:5006/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
