worker_processes auto;

events {
  worker_connections 1024;
}

stream {
  server {
    listen 34197 udp reuseport;
    proxy_pass factorio-server:34197;
  }
}

http {
  client_max_body_size 10M;
  proxy_headers_hash_max_size 1024;
  proxy_headers_hash_bucket_size 128;
  log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'Host:"$host" Auth:"$http_authorization" '
                    'X-Forwarded-For:"$proxy_add_x_forwarded_for" '
                    'X-Real-IP:"$http_x_real_ip"';

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log;

  # Common TLS settings
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Authelia upstream for auth_request
  upstream authelia_upstream {
    server authelia:9091;
  }

  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name
      _
      localhost
      joshowen.uk
      joshowen.co.uk;
    server_tokens off;

    location ^~ /.well-known/acme-challenge {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
      #return 403 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.joshowen.uk;

    ssl_certificate     /etc/letsencrypt/live/joshowen.uk-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joshowen.uk-0001/privkey.pem;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      proxy_pass http://authelia_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }


  server {
    listen 443 default_server ssl;
    listen [::]:443 ssl;
    server_name localhost dogdaysadventure.xyz joshowen.uk joshowen.co.uk;

    ssl_certificate     /etc/letsencrypt/live/joshowen.uk-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joshowen.uk-0001/privkey.pem;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    auth_request /authelia;
    error_page 401 =302 https://auth.joshowen.uk/?rd=$scheme://$host$request_uri;

    location = /authelia {
      internal;
      proxy_pass http://authelia_upstream/api/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";

      proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;

      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
    }

    location / {
      proxy_pass http://activepetz:80/;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

