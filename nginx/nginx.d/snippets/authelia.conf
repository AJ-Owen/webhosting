auth_request /authelia;
error_page 401 =302 https://auth.joshowen.uk/?rd=$scheme://$host$request_uri;

# Identity headers exposed for downstream apps that want them.
# Unused vars in other vhosts are harmless.
auth_request_set $authelia_user   $upstream_http_remote_user;
auth_request_set $authelia_groups $upstream_http_remote_groups;
auth_request_set $authelia_name   $upstream_http_remote_name;
auth_request_set $authelia_email  $upstream_http_remote_email;

location = /authelia {
  internal;
  proxy_pass http://authelia_upstream/api/verify;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";

  proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;

  proxy_set_header Host $host;
  proxy_set_header Authorization $http_authorization;
}
