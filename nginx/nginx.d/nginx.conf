worker_processes auto;

events {
  worker_connections 1024;
}

stream {
  resolver 127.0.0.11 valid=30s ipv6=off;
  server {
    listen 34197 udp reuseport;
    set $factorio factorio-server:34197;
    proxy_pass $factorio;
  }
}

http {
  client_max_body_size 10M;
  proxy_headers_hash_max_size 1024;
  proxy_headers_hash_bucket_size 128;
  log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'Host:"$host" Auth:"$http_authorization" '
                    'X-Forwarded-For:"$proxy_add_x_forwarded_for" '
                    'X-Real-IP:"$http_x_real_ip"';

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log;

  # Common TLS settings
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  resolver 127.0.0.11 valid=30s;
  resolver_timeout 5s;

  # Security headers applied to all proxied responses
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Authelia upstream for auth_request
  upstream authelia_upstream {
    server authelia:9091;
  }

  # Pebble webhook capture bypasses Authelia (device can't do a browser login);
  # WEBHOOK_TOKEN bearer auth in the app is the security boundary instead.
  limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/m;

  # WebSocket upgrade helper: only set Connection: upgrade when client actually upgraded
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  # ---- HTTP → HTTPS redirect + ACME challenge ----
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ localhost joshowen.uk joshowen.co.uk;
    server_tokens off;

    location ^~ /.well-known/acme-challenge {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---- Authelia portal ----
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.joshowen.uk;
    include /etc/nginx/nginx.d/snippets/ssl.conf;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      proxy_pass http://authelia_upstream;
      include /etc/nginx/nginx.d/snippets/proxy_common.conf;
    }
  }

  # ---- Default vhost: activepetz (public, no auth) ----
  server {
    listen 443 default_server ssl;
    listen [::]:443 ssl;
    server_name localhost dogdaysadventure.xyz joshowen.uk joshowen.co.uk;
    include /etc/nginx/nginx.d/snippets/ssl.conf;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      set $upstream http://activepetz:80;
      proxy_pass $upstream;
      include /etc/nginx/nginx.d/snippets/proxy_common.conf;
      proxy_set_header X-Forwarded-Host $host;
    }
  }

  # ---- pdf.joshowen.uk ----
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pdf.joshowen.uk;
    include /etc/nginx/nginx.d/snippets/ssl.conf;
    include /etc/nginx/nginx.d/snippets/authelia.conf;

    location / {
      set $upstream http://pdf_tool:8080;
