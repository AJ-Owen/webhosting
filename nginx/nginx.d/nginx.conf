      include /etc/nginx/nginx.d/snippets/proxy_common.conf;
      proxy_set_header Authorization $http_authorization;
    }
  }

  # ---- assistant.joshowen.uk ----
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name assistant.joshowen.uk;
    include /etc/nginx/nginx.d/snippets/ssl.conf;
    include /etc/nginx/nginx.d/snippets/authelia.conf;

    # Pebble device posts here directly; it can't complete an Authelia
    # browser login, so this bypasses SSO and relies on the app's own
    # WEBHOOK_TOKEN bearer check. Rate-limited since it triggers Anthropic
    # API calls per request.
    location ^~ /webhook {
      auth_request off;
      limit_req zone=webhook_limit burst=5 nodelay;

      set $upstream http://assistant:8000;
      proxy_pass $upstream;
      include /etc/nginx/nginx.d/snippets/proxy_common.conf;
      proxy_set_header Authorization $http_authorization;
    }

    location / {
      set $upstream http://assistant:8000;
      proxy_pass $upstream;
      include /etc/nginx/nginx.d/snippets/proxy_common.conf;
      proxy_set_header Authorization $http_authorization;
    }
  }

  # ---- ha.joshowen.uk (Home Assistant, via WireGuard tunnel to home) ----
  # Uses HA's own native login (no Authelia) so the companion app and
  # integrations keep working. socat inside the `wireguard` container
  # forwards :8123 over the tunnel to HA on the home LAN.
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ha.joshowen.uk;
    include /etc/nginx/nginx.d/snippets/ssl.conf;
    client_max_body_size 100M;

    # Separate log so the HA companion app (which legitimately emits occasional
    # 400s on websocket reconnects / webhook retries) is policed by its own,
    # more permissive fail2ban jails instead of the strict shared ones that
    # would ban the user's roaming mobile IP out of every service. Default
    # (combined) format so the standard nginx-* filters match.
    access_log /var/log/nginx/ha_access.log;

    location / {
      set $upstream http://wireguard:8123;
      proxy_pass $upstream;
      include /etc/nginx/nginx.d/snippets/proxy_common.conf;
      include /etc/nginx/nginx.d/snippets/proxy_ws.conf;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }

  # ---- obsidian.joshowen.uk ----
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name obsidian.joshowen.uk;
    include /etc/nginx/nginx.d/snippets/ssl.conf;
    include /etc/nginx/nginx.d/snippets/authelia.conf;

    # obsidian-remote/code-server uses internal iframes; relax from global DENY
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
      set $upstream http://obsidian-remote:8080;
      proxy_pass $upstream;
      include /etc/nginx/nginx.d/snippets/proxy_common.conf;
      include /etc/nginx/nginx.d/snippets/proxy_ws.conf;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }

  # ---- ntfy.joshowen.uk ----
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ntfy.joshowen.uk;
    include /etc/nginx/nginx.d/snippets/ssl.conf;
    include /etc/nginx/nginx.d/snippets/authelia.conf;

    location / {
      set $upstream http://ntfy:80;
      proxy_pass $upstream;
