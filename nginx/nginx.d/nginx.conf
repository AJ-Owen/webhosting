  # ---- books.joshowen.uk (Calibre-Web) ----
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name books.joshowen.uk;
    include /etc/nginx/nginx.d/snippets/ssl.conf;
    include /etc/nginx/nginx.d/snippets/authelia.conf;

    location / {
      set $upstream http://calibre-web-automated:8083;
      proxy_pass $upstream;
      include /etc/nginx/nginx.d/snippets/proxy_common.conf;
      proxy_set_header Authorization $http_authorization;

      # Forward Authelia identity to Calibre-Web (Reverse Proxy Login)
      proxy_set_header Remote-User   $authelia_user;
      proxy_set_header Remote-Groups $authelia_groups;
      proxy_set_header Remote-Name   $authelia_name;
      proxy_set_header Remote-Email  $authelia_email;
    }
  }

  # ---- books-request.joshowen.uk (CWA Book Downloader) ----
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
