      include /etc/nginx/nginx.d/snippets/proxy_ws.conf;
    }
  }

  # ---- beszel.joshowen.uk ----
  # Agent endpoints (/api/beszel/agent-connect, /api/realtime) bypass Authelia
  # and are restricted to the homelab WAN IP for the proxmox beszel-agent.
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name beszel.joshowen.uk;
    include /etc/nginx/nginx.d/snippets/ssl.conf;
    include /etc/nginx/nginx.d/snippets/authelia.conf;

    location ^~ /api/beszel/agent-connect {
      allow 51.155.219.237;
      deny all;
      auth_request off;

      set $upstream http://beszel:8090;
      proxy_pass $upstream;
      include /etc/nginx/nginx.d/snippets/proxy_common.conf;
      include /etc/nginx/nginx.d/snippets/proxy_ws.conf;
      proxy_read_timeout 86400;
    }

    location ^~ /api/realtime {
      allow 51.155.219.237;
      deny all;
      auth_request off;

      set $upstream http://beszel:8090;
      proxy_pass $upstream;
      include /etc/nginx/nginx.d/snippets/proxy_common.conf;
      include /etc/nginx/nginx.d/snippets/proxy_ws.conf;
      proxy_read_timeout 86400;
    }

    location / {
      set $upstream http://beszel:8090;
      proxy_pass $upstream;
      include /etc/nginx/nginx.d/snippets/proxy_common.conf;
      include /etc/nginx/nginx.d/snippets/proxy_ws.conf;
    }
  }

  # ---- uptime.joshowen.uk (Uptime Kuma) ----
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name uptime.joshowen.uk;
