    }
  }

  # ---- dockge.joshowen.uk ----
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dockge.joshowen.uk;
    include /etc/nginx/nginx.d/snippets/ssl.conf;
    include /etc/nginx/nginx.d/snippets/authelia.conf;

    location / {
      set $upstream http://dockge:5001;
      proxy_pass $upstream;
      include /etc/nginx/nginx.d/snippets/proxy_common.conf;
      include /etc/nginx/nginx.d/snippets/proxy_ws.conf;
    }
  }

  # ---- draw.joshowen.uk (Excalidraw whiteboard) ----
  # Single domain fronts the whole stack:
  #   /socket.io/  -> excalidraw-room    (live collaboration relay, websockets)
  #   /api/v2/     -> excalidraw-storage (persistent "save to link" scenes)
  #   /            -> excalidraw         (the static app)
  # All behind Authelia. The collab websocket and the /api/v2 fetches are
  # same-origin, so the .joshowen.uk session cookie rides along and
  # auth_request passes once the user is logged in.
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name draw.joshowen.uk;
    include /etc/nginx/nginx.d/snippets/ssl.conf;
    # Large scenes / embedded images on save (storage backend BODY_LIMIT=50mb).
    client_max_body_size 50M;
    include /etc/nginx/nginx.d/snippets/authelia.conf;

    location /socket.io/ {
      set $upstream http://excalidraw-room:80;
      proxy_pass $upstream;
      include /etc/nginx/nginx.d/snippets/proxy_common.conf;
      include /etc/nginx/nginx.d/snippets/proxy_ws.conf;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /api/v2/ {
      set $upstream http://excalidraw-storage:8080;
      proxy_pass $upstream;
      include /etc/nginx/nginx.d/snippets/proxy_common.conf;
    }

    location / {
      set $upstream http://excalidraw:80;
      proxy_pass $upstream;
      include /etc/nginx/nginx.d/snippets/proxy_common.conf;
    }
  }
}
