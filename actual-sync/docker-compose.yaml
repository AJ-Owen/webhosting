services:
  actual-auto-sync-server:
    image: seriouslag/actual-auto-sync:latest
    container_name: actual-sync
    env_file: docker-compose.env
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - actual-network

networks:
  actual-network:
    name: actual_budget_network
    external: true
