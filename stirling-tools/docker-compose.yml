services:
  pdf_tool:
    image: stirlingtools/stirling-pdf:latest
    container_name: pdf_tool
    volumes:
      - ./data/trainingData:/usr/share/tessdata # Required for extra OCR languages
      - ./data/configs:/configs
      - ./data/customFiles:/customFiles/
      - ./data/logs:/logs/
      - ./data/pipeline:/pipeline/
    environment:
      - UI_APP_NAME=DDA PDF tools
      - UI_HOME_DESCRIPTION=Hosted in the cloud for your doggy convenience
      - UI_APP_NAVBAR_NAME=DDA PDF
      - DOCKER_ENABLE_SECURITY=true
      - SECURITY_ENABLE_LOGIN=true
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=false
      - LANGS=en_GB
      - SECURITY_INITIALLOGIN_USERNAME=josh
      - SECURITY_INITIALLOGIN_PASSWORD=123
      # - SYSTEM_ROOTURIPATH=/pdf
    restart: unless-stopped
    mem_limit: 512m # JVM MaxRAMPercentage=75 -> ~384MB heap cap (was unbounded vs full host RAM)
    networks:
      - frontend

networks:
  frontend:
    name: docker_proxy_network
    external: true
